name: Publish

on:
  push:
    # main goes to production, next to the preview at /frontfall-next/.
    branches: [main, next]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      now:
        description: Deploy without announcing the update or waiting for the games in progress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SITE: ${{ github.ref == 'refs/heads/next' && 'https://nclsmgr.com/frontfall-next/' || 'https://nclsmgr.com/frontfall/' }}
  # Word the server's deploy command reads before the tag: none for production.
  TARGET: ${{ github.ref == 'refs/heads/next' && 'next' || '' }}

jobs:
  # Each architecture builds on a native runner, then is scanned before any tag is set.
  image:
    name: Image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # Pushed by digest only: nothing is tagged before the scan passes.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: FRONTFALL_VERSION=${{ steps.version.outputs.commit }}
          platforms: linux/${{ matrix.arch }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The digest names an index (image and attestations): pick the architecture.
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  manifest:
    name: Tag the multi-arch image
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest and set the tags
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: digests
        # Every build is tagged with its commit; main also moves latest, next moves next,
        # a v1.2.3 tag adds 1.2.3.
        run: |
          tags=(-t "$IMAGE:$TAG")
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(-t "$IMAGE:latest"); fi
          if [ "$GITHUB_REF" = refs/heads/next ]; then tags+=(-t "$IMAGE:next"); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(-t "$IMAGE:${GITHUB_REF_NAME#v}"); fi
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"

  deploy:
    name: Deploy
    needs: manifest
    # Releases are tagged from commits already deployed from main. The preview needs its own
    # switch, set once the server has a second Compose project for it.
    if: >-
      (vars.DEPLOIEMENT_ACTIF == 'true' && github.ref == 'refs/heads/main') ||
      (vars.PREPROD_ACTIVE == 'true' && github.ref == 'refs/heads/next')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # A server with a data directory (keepsGames) keeps the games in progress across a
      # restart, and the new one takes them back if it has the same simulation build. Otherwise the restart stops them: when some
      # are running, every player is told the update is coming, then the games get that long
      # to end.
      - name: Announce the update and wait for the games in progress
        if: ${{ !inputs.now }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          MINUTES: ${{ vars.ANNONCE_MINUTES || '10' }}
        run: |
          # A server that does not answer may still hold games: "unknown" waits as if some ran.
          running() {
            local count
            count=$(curl -fsS --max-time 10 "${SITE}api/games" | jq -er '.running') || count=unknown
            case "$count" in '' | *[!0-9]*) echo unknown ;; *) echo "$count" ;; esac
          }
          if [ "$(running)" = 0 ]; then
            echo "No game in progress"
            exit 0
          fi
          live=$(curl -fsS --max-time 10 "${SITE}api/status" | jq -r 'select(.keepsGames == true) | .simulation // ""' || true)
          if [ -n "$live" ] && [ "$live" != dev ] && [ "$live" = "$(node tools/simulation-build.mjs)" ]; then
            echo "Same simulation build $live: the games in progress go on after the restart"
            exit 0
          fi
          ssh -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "frontfall@${HOST}" $TARGET annonce "$MINUTES" < /dev/null \
            || echo "::warning::The server could not announce the update; waiting anyway"
          deadline=$((SECONDS + MINUTES * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            count=$(running)
            if [ "$count" = 0 ]; then
              echo "The games in progress have ended"
              exit 0
            fi
            echo "$count game(s) in progress, waiting"
            sleep 30
          done
          echo "::warning::Games still in progress after $MINUTES minutes; deploying anyway"
      - name: Roll out the new image
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.manifest.outputs.tag }}
        # The key only allows a forced command on the server, which reads a target, a tag and
        # nothing else.
        run: |
          ssh -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "frontfall@${HOST}" $TARGET "$TAG" < /dev/null
      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy
      - name: Wait for the new version to answer
        env:
          TAG: ${{ needs.manifest.outputs.tag }}
        run: |
          for _ in $(seq 12); do
            version=$(curl -fsS -o /dev/null -D - "${SITE}healthz" \
              | tr -d '\r' | awk -F': ' 'tolower($1) == "x-frontfall-version" { print $2 }') || true
            if [ "$version" = "$TAG" ]; then
              echo "${SITE} serves $TAG"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${SITE}healthz does not report $TAG after 60 s (last answer: ${version:-none})"
          exit 1

      # The page and the map list are cached for a minute by Cloudflare (a cache rule): after a
      # roll out, drop them so that nobody gets a page that names the previous build's files.
      # Skipped while the token is not set, and only a warning when Cloudflare refuses it.
      - name: Purge the cached page
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "::notice::No Cloudflare token: the cached page is not purged"
            exit 0
          fi
          body=$(jq -nc --arg site "$SITE" \
            '{files: [$site, ($site + "index.html"), ($site + "maps/index.json")]}')
          # A refused purge (expired token, say) leaves a stale page for a while, not a broken
          # deploy: warn, and let the smoke test run.
          if ! curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data "$body" | jq -e '.success' > /dev/null; then
            echo "::warning::The Cloudflare purge failed: the cached page may be stale until it expires"
          fi

  smoke:
    name: Smoke test of the deployed site
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @frontfall/e2e
      - run: pnpm --filter @frontfall/e2e exec playwright install --with-deps chromium
      # Loads the live page through Cloudflare and plays on a real WebSocket.
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ env.SITE }}
