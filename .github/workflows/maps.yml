name: Maps

# Rebuilds every map from its pinned sources and fails if a single byte differs
# from the committed files, or if a map changed without a new version.
on:
  pull_request:
    paths: &map-paths
      - "tools/mapgen/**"
      - "tools/src/mapgen/**"
      - "apps/client/public/maps/**"
      - "packages/engine/src/map/**"
      - ".github/workflows/maps.yml"
  push:
    branches-ignore: ["dependabot/**"]
    paths: *map-paths

permissions:
  contents: read

concurrency:
  group: maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild maps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Sources are pinned by SHA-256, so the list of pins is the cache key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/mapgen
          key: mapgen-${{ hashFiles('tools/mapgen/sources.json') }}
      # Downloads missing sources, checks their SHA-256, builds and times the loader.
      # Thumbnails are only rewritten when their pixels change (docs/maps.md).
      - run: bun run maps --check
      - name: Compare with the committed maps
        run: |
          git status --porcelain -- apps/client/public/maps tools/mapgen
          git diff --exit-code --stat -- apps/client/public/maps tools/mapgen
          test -z "$(git status --porcelain -- apps/client/public/maps tools/mapgen)"
