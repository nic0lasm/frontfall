name: Feature proposal
description: Suggest a change to the game or the tooling.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today, from a player's or contributor's point of view.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
