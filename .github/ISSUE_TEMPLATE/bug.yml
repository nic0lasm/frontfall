name: Bug report
description: Something does not work as it should.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Join a public lobby
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Firefox 144, Windows 11
  - type: input
    id: version
    attributes:
      label: Game version or commit
