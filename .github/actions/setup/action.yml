name: Set up the toolchain
description: Node.js from .nvmrc (what vitest, Playwright and the server run on), Bun (the package manager and script runner), and the locked dependencies.
inputs:
  filter:
    description: Install only this workspace and what it needs (a package name), instead of all of them.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - name: Install the dependencies
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: |
        if [ -n "$FILTER" ]; then
          bun install --frozen-lockfile --filter "$FILTER"
        else
          bun install --frozen-lockfile
        fi
